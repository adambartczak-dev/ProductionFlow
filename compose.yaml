name: productionflow

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Uzupełnij POSTGRES_DB w .env}
      POSTGRES_USER: ${POSTGRES_USER:?Uzupełnij POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Uzupełnij POSTGRES_PASSWORD w .env}
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/ProductionFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__ProductionFlow: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Uzupełnij POSTGRES_DB};Username=${POSTGRES_USER:?Uzupełnij POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Uzupełnij POSTGRES_PASSWORD}"
      DemoUsers__Admin__Password: ${DEMO_ADMIN_PASSWORD:?Uzupełnij DEMO_ADMIN_PASSWORD}
      DemoUsers__Planner__Password: ${DEMO_PLANNER_PASSWORD:?Uzupełnij DEMO_PLANNER_PASSWORD}
      DemoUsers__Operator__Password: ${DEMO_OPERATOR_PASSWORD:?Uzupełnij DEMO_OPERATOR_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Uzupełnij RABBITMQ_USER w .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Uzupełnij RABBITMQ_PASSWORD w .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/ProductionFlow.Worker/Dockerfile
    environment:
      ConnectionStrings__ProductionFlow: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Uzupełnij POSTGRES_DB};Username=${POSTGRES_USER:?Uzupełnij POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Uzupełnij POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?Uzupełnij RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Uzupełnij RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    build:
      context: .
      dockerfile: src/ProductionFlow.OutboxPublisher/Dockerfile
    environment:
      ConnectionStrings__ProductionFlow: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?Uzupełnij POSTGRES_DB};Username=${POSTGRES_USER:?Uzupełnij POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Uzupełnij POSTGRES_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?Uzupełnij RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Uzupełnij RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  publisher:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/ProductionFlow.Publisher/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER:?Uzupełnij RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Uzupełnij RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data: